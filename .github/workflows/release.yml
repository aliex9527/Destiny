name: Build & Release

# 推送 v* tag 即在本机构建 APK 并发布 Release。
# 构建在 CI 完成，仓库不存放任何二进制；签名沿用同一个 keystore（来自 Secrets），
# 因此升级链路与本地构建的包一致。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号，如 v1.4.1（须已存在的 tag）'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 build-tools 34 与 platform 34
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: 还原签名密钥
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::缺少 Secrets.KEYSTORE_BASE64，无法签名。见 RELEASE.md 配置说明。"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KS_B64" | base64 -d > keystore/dlt-release.jks
          ls -l keystore/dlt-release.jks

      - name: 解析版本号
        id: ver
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          V="${REF#v}"
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"
          echo "versionName=$V（versionCode 由脚本按 MAJOR*10000+MINOR*100+PATCH 计算）"

      - name: 构建 APK
        env:
          DLT_JDK: ${{ env.JAVA_HOME }}
          DLT_BT: ${{ env.ANDROID_HOME }}/build-tools/34.0.0
          DLT_ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-34/android.jar
          DLT_KS: ${{ github.workspace }}/keystore/dlt-release.jks
          DLT_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          DLT_VERSION: ${{ steps.ver.outputs.VERSION }}
          DLT_REQUIRE_KS: '1'
        run: |
          python3 tools/build_apk.py
          ls -l dist/*.apk
          sha256sum dist/*.apk

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 运 ${{ steps.ver.outputs.VERSION }}
          files: dist/*.apk
          draft: false
          prerelease: false
          body: |
            ## 运 ${{ steps.ver.outputs.VERSION }}

            纯本地运行的彩票数据分析工具（Android）。

            - 包名 `com.micai.dlt`，最低 Android 6.0（API 23），目标 API 34
            - 安装包见下方附件，签名与历史版本一致，可直接覆盖升级

            ### 构建信息

            - 由 GitHub Actions 在 Ubuntu 上使用 JDK 17 + Android build-tools 34 构建
            - 构建脚本 `tools/build_apk.py`（无 Gradle），产物经 zipalign 与 apksigner v1/v2/v3 签名

            > 开奖数据来自官方公开结果，仅供个人研究与娱乐使用，本项目不提供任何购彩服务。
