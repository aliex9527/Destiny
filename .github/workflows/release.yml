name: Build & Release

# 推送 v* tag 即在本机构建 APK 并发布 Release。
# 不依赖任何 JDK / Android 的 marketplace action：runner 自带环境，由 tools/ci_build.sh 探测并回退。
# 诊断设计：无论成功失败，最后都会把 ci-build.log 推到 ci-logs 分支，
# 因此只靠 git（SSH）就能读到 CI 日志，不需要任何 token。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号，如 v1.4.1（须已存在的 tag）'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          set -o pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          V="${REF#v}"
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"
          { echo "== 解析版本 =="; echo "tag=$REF version=$V"; } 2>&1 | tee -a ci-build.log

      - name: 还原签名密钥
        continue-on-error: true
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -o pipefail
          { echo "== 还原签名密钥 =="
            if [ -z "${KS_B64:-}" ]; then
              echo "[失败] 缺少 Secrets.KEYSTORE_BASE64"
              echo "       到 Settings → Secrets and variables → Actions 添加，见 RELEASE.md"
              exit 1
            fi
            echo "b64 长度: ${#KS_B64}"
            mkdir -p keystore
            printf '%s' "$KS_B64" | base64 -d > keystore/dlt-release.jks
            ls -l keystore/dlt-release.jks
          } 2>&1 | tee -a ci-build.log

      - name: 构建 APK
        id: build
        continue-on-error: true
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          VER: ${{ steps.ver.outputs.VERSION }}
          DLT_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          DLT_VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          set -o pipefail
          bash tools/ci_build.sh 2>&1 | tee -a ci-build.log
          exit "${PIPESTATUS[0]}"

      - name: 回传日志到 ci-logs 分支
        if: always()
        run: |
          {
            echo "build outcome: ${{ steps.build.outcome }}"
            echo "run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> ci-build.log
          mkdir -p .ci
          cp ci-build.log .ci/ci-build.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f .ci/ci-build.log
          git commit -m "ci: build log for ${{ github.ref_name }} (${{ steps.build.outcome }})" || echo "no change"
          git push -f origin ci-logs

      - name: 发布 Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 运 ${{ steps.ver.outputs.VERSION }}
          files: dist/*.apk
          draft: false
          prerelease: false
          body: |
            ## 运 ${{ steps.ver.outputs.VERSION }}

            纯本地运行的彩票数据分析工具（Android）。

            - 包名 `com.micai.dlt`，最低 Android 6.0（API 23），目标 API 34
            - 安装包见下方附件，签名与历史版本一致，可直接覆盖升级

            ### 构建信息

            - 由 GitHub Actions 在 Ubuntu 上构建（runner 自带 JDK 17 + Android SDK）
            - 构建脚本 `tools/build_apk.py`（无 Gradle），产物经 zipalign 与 apksigner v1/v2/v3 签名

            > 开奖数据来自官方公开结果，仅供个人研究与娱乐使用，本项目不提供任何购彩服务。

      - name: 构建失败则标记任务失败
        if: steps.build.outcome != 'success'
        run: |
          echo "构建未成功，日志已推送到 ci-logs 分支。"
          exit 1
