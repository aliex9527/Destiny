name: Build & Release

# 推送 v* tag 即在本机构建 APK 并发布 Release。
# 构建在 CI 完成，仓库不存放任何二进制；签名沿用同一个 keystore（来自 Secrets），
# 因此升级链路与本地构建的包一致。
#
# 诊断设计：无论成功失败，最后都会把 ci-build.log 推到 ci-logs 分支。
# 这样只靠 git（SSH）就能读到 CI 日志，不需要任何 token。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号，如 v1.4.1（须已存在的 tag）'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 build-tools 34 与 platform 34
        run: |
          set -o pipefail
          { echo "== sdkmanager 安装 =="
            echo "ANDROID_HOME=$ANDROID_HOME"
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "build-tools;34.0.0" "platforms;android-34"
            echo "== 已安装 =="
            ls -l "$ANDROID_HOME/build-tools/34.0.0" | head -20
            ls -l "$ANDROID_HOME/platforms/android-34/android.jar"
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-build.log"

      - name: 解析版本号
        id: ver
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          V="${REF#v}"
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$REF version=$V" | tee -a "$GITHUB_WORKSPACE/ci-build.log"

      - name: 还原签名密钥
        run: |
          set -o pipefail
          { echo "== 还原签名密钥 =="
            if [ -z "$KS_B64" ]; then
              echo "缺少 Secrets.KEYSTORE_BASE64，无法签名。见 RELEASE.md 配置说明。"
              exit 1
            fi
            echo "b64 长度: ${#KS_B64}"
            mkdir -p keystore
            printf '%s' "$KS_B64" | base64 -d > keystore/dlt-release.jks
            ls -l keystore/dlt-release.jks
            file keystore/dlt-release.jks
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-build.log"
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: 构建 APK
        id: build
        continue-on-error: true
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          VER: ${{ steps.ver.outputs.VERSION }}
        run: |
          set -o pipefail
          # 用 shell 展开而不是表达式，避免 ANDROID_HOME 在表达式上下文里取不到值
          export DLT_JDK="$JAVA_HOME"
          export DLT_BT="$ANDROID_HOME/build-tools/34.0.0"
          export DLT_ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          export DLT_KS="$GITHUB_WORKSPACE/keystore/dlt-release.jks"
          export DLT_KS_PASS="$KS_PASS"
          export DLT_VERSION="$VER"
          export DLT_REQUIRE_KS=1
          { echo "== 构建环境 =="
            echo "DLT_JDK=$DLT_JDK"
            echo "DLT_BT=$DLT_BT"
            echo "DLT_ANDROID_JAR=$DLT_ANDROID_JAR"
            echo "DLT_VERSION=$DLT_VERSION"
            python3 --version
            "$DLT_JDK/bin/java" -version
            echo "== 开始构建 =="
            python3 tools/build_apk.py
            echo "== 产物 =="
            ls -l dist/*.apk
            sha256sum dist/*.apk
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-build.log"

      - name: 回传日志到 ci-logs 分支
        if: always()
        run: |
          echo "build outcome: ${{ steps.build.outcome }}" >> "$GITHUB_WORKSPACE/ci-build.log"
          echo "run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_WORKSPACE/ci-build.log"
          mkdir -p .ci
          cp "$GITHUB_WORKSPACE/ci-build.log" .ci/ci-build.log || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f .ci/ci-build.log
          git commit -m "ci: build log for ${{ github.ref_name }} (${{ steps.build.outcome }})" || echo "no change"
          git push -f origin ci-logs

      - name: 发布 Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 运 ${{ steps.ver.outputs.VERSION }}
          files: dist/*.apk
          draft: false
          prerelease: false
          body: |
            ## 运 ${{ steps.ver.outputs.VERSION }}

            纯本地运行的彩票数据分析工具（Android）。

            - 包名 `com.micai.dlt`，最低 Android 6.0（API 23），目标 API 34
            - 安装包见下方附件，签名与历史版本一致，可直接覆盖升级

            ### 构建信息

            - 由 GitHub Actions 在 Ubuntu 上使用 JDK 17 + Android build-tools 34 构建
            - 构建脚本 `tools/build_apk.py`（无 Gradle），产物经 zipalign 与 apksigner v1/v2/v3 签名

            > 开奖数据来自官方公开结果，仅供个人研究与娱乐使用，本项目不提供任何购彩服务。

      - name: 构建失败则标记任务失败
        if: steps.build.outcome != 'success'
        run: |
          echo "构建失败，日志已推送到 ci-logs 分支。"
          exit 1
