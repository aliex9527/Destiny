name: Release

# 签名密钥只保存在本地，CI 不再构建，避免密钥进入仓库。
# 流程：本地 tools/release.py 构建并签名 → APK 推到 release-assets 分支 → 推送 v* tag
#       → 本工作流取回该 APK、校验后发布 Release。
# release-assets 是单提交孤儿分支，每次发布强制覆盖，不累积历史。
# 诊断设计：无论成功失败，最后都把 ci-build.log 推到 ci-logs 分支，
# 因此只靠 git（SSH）就能读到日志，不需要任何 token。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号，如 v1.5.1（须已存在的 tag）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: ver
        run: |
          set -o pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          V="${REF#v}"
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"
          { echo "== 解析版本 =="; echo "tag=$REF version=$V"; } 2>&1 | tee -a ci-build.log

      - name: 取回本地构建的安装包
        id: fetch_apk
        env:
          VER: ${{ steps.ver.outputs.VERSION }}
        run: |
          set -o pipefail
          { echo "== 取回 release-assets =="
            if ! git fetch --depth=1 origin release-assets 2>/dev/null; then
              echo "[失败] 远端没有 release-assets 分支"
              echo "       先在本地执行：python tools/release.py --version $VER"
              exit 1
            fi
            mkdir -p dist
            files=$(git ls-tree -r --name-only FETCH_HEAD | grep -Ei '\.apk$' || true)
            if [ -z "$files" ]; then echo "[失败] release-assets 分支里没有 apk"; exit 1; fi
            for f in $files; do
              out="dist/$(basename "$f")"
              git show "FETCH_HEAD:$f" > "$out"
              echo "取出 $f -> $out"
            done
            ls -l dist/
            sha256sum dist/*.apk
          } 2>&1 | tee -a ci-build.log

      - name: 校验安装包
        continue-on-error: true
        env:
          VER: ${{ steps.ver.outputs.VERSION }}
        run: |
          set -o pipefail
          {
            echo "== 校验安装包 =="
            SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            BT="$(ls -d "$SDK"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
            BT="${BT%/}"
            APK="$(ls dist/*.apk | head -1)"
            echo "apk=$APK"
            echo "build-tools=${BT:-<未找到>}"

            if [ -n "$BT" ] && [ -x "$BT/aapt2" ]; then
              BADGING="$("$BT/aapt2" dump badging "$APK" | head -1)"
              echo "$BADGING"
              VN="$(printf '%s' "$BADGING" | grep -o "versionName='[^']*'" | cut -d\"'\" -f2)"
              VC="$(printf '%s' "$BADGING" | grep -o "versionCode='[^']*'" | cut -d\"'\" -f2)"
              echo "包内 versionName=$VN versionCode=$VC / tag 期望 $VER"
              if [ "$VN" != "$VER" ]; then
                echo "[失败] 包内版本与 tag 不一致：$VN != $VER"
                exit 1
              fi
            else
              echo "[跳过] 找不到 aapt2，未能读取包内版本"
            fi

            if [ -n "$BT" ] && [ -f "$BT/lib/apksigner.jar" ]; then
              java -jar "$BT/lib/apksigner.jar" verify --verbose "$APK" | tee /tmp/sig.txt
              grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/sig.txt \
                || echo "[警告] 未检测到 v2 签名"
            else
              echo "[跳过] 找不到 apksigner.jar"
            fi
          } 2>&1 | tee -a ci-build.log

      - name: 发布 Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Destiny ${{ steps.ver.outputs.VERSION }}
          files: dist/*.apk
          draft: false
          prerelease: false
          body: |
            ## Destiny ${{ steps.ver.outputs.VERSION }}

            纯本地运行的彩票数据分析工具（Android）。

            - 包名 `com.micai.dlt`，最低 Android 6.0（API 23），目标 API 34
            - 安装包见下方附件，签名与历史版本一致，可直接覆盖升级

            ### 构建信息

            - 在本地构建并签名（签名密钥只保存在本机，不入仓库、不经 CI）
            - 构建脚本 `tools/build_apk.py`（无 Gradle），产物经 zipalign 与 apksigner v1/v2/v3 签名
            - 本工作流只负责校验与分发：核对包内版本号与 tag 一致后上传附件

            > 开奖数据来自官方公开结果，仅供个人研究与娱乐使用，本项目不提供任何购彩服务。

      - name: 发布失败则标记任务失败
        if: steps.release.outcome != 'success'
        run: |
          echo "Release 未创建成功，日志见 ci-logs 分支。"
          exit 1

      - name: 回传日志到 ci-logs 分支
        if: always()
        run: |
          {
            echo "fetch outcome: ${{ steps.fetch_apk.outcome }}"
            echo "release outcome: ${{ steps.release.outcome }}"
            echo "run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "assets in dist:"
            ls -l dist/ 2>/dev/null || echo "(no dist)"
          } >> ci-build.log
          mkdir -p .ci
          cp ci-build.log .ci/ci-build.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f .ci/ci-build.log
          git commit -m "ci: release log for ${{ github.ref_name }} (${{ steps.release.outcome }})" || echo "no change"
          git push -f origin ci-logs
