name: Smoke Build

# 临时工作流：在没有签名密钥的情况下验证 Linux 构建链路是否可用。
# 不创建 Release，只把日志推到 ci-logs 分支。用 push tag smoke-* 触发。
on:
  push:
    tags:
      - 'smoke-*'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建（允许自动生成临时签名）
        id: build
        continue-on-error: true
        env:
          DLT_REQUIRE_KS: '0'
          DLT_VERSION: '0.0.0-smoke'
        run: |
          set -o pipefail
          bash tools/ci_build.sh 2>&1 | tee -a ci-build.log
          exit "${PIPESTATUS[0]}"

      - name: 回传日志
        if: always()
        run: |
          echo "build outcome: ${{ steps.build.outcome }}" >> ci-build.log
          mkdir -p .ci
          cp ci-build.log .ci/ci-build.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f .ci/ci-build.log
          git commit -m "smoke: ${{ steps.build.outcome }}" || echo "no change"
          git push -f origin ci-logs
