[package]
name = "destiny"
version = "2.1.0"
edition = "2021"
publish = false
description = "Destiny - 本地彩票数据分析工具（Rust 原生实现）"

[lib]
name = "destiny"
crate-type = ["cdylib", "rlib"]

# 桌面预览：同一套 UI 代码在 Windows 上跑，用来截图检查布局，
# 不必每次刷机验证。发布产物不含它。
[[bin]]
name = "preview"
path = "src/main.rs"

[dependencies]
# glow 后端（OpenGL ES）比 wgpu 轻得多，Android 上覆盖也更广
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "android-native-activity",
] }
egui = "0.37"
log = "0.4"

# ndk-sys 只允许为 Android 编译，这两个必须按平台限定，
# 否则桌面预览（src/main.rs）会直接编译失败。
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"

[dev-dependencies]
egui = "0.37"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
